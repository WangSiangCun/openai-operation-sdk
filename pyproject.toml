[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-operation-sdk"
version = "0.2.1"
readme = "README.md"
description = "Modular proxy-locked OpenAI operations: Team workspaces and account security (unofficial)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0", "curl-cffi>=0.7.0"]

[project.urls]
Repository = "https://github.com/WangSiangCun/openai-operation-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
